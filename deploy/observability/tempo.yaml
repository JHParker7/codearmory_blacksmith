stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # A run settles in tens of minutes, so a long idle window would leave the most
  # recent (and most interesting) spans unqueryable exactly when they are wanted.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h # a week of runs is plenty for A/B comparison

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
