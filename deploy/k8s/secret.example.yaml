# The sandbox plane's secret. NOT part of forge-local.yaml, deliberately.
#
# It used to live in that file with REPLACE_ME placeholders, which made
# `kubectl apply -f forge-local.yaml` - the documented way to update the plane -
# silently overwrite the real secret with placeholders. Nothing fails at apply
# time: the running pods keep their old environment and the plane looks healthy,
# so the damage only surfaces at the NEXT pod restart, when a service comes back
# with the key "REPLACE_ME" and its permission checks start failing for reasons
# that have nothing to do with whatever was changed in between.
#
# Kept separate so the destructive apply is not the routine one. Fill this in
# once, apply it once, and keep the values in the plane's secrets file.
#
#   sed -e "s/REPLACE_SERVICE_KEY/$(openssl rand -hex 32)/g" \
#       -e "s/REPLACE_ADMIN_PASSWORD/$(openssl rand -hex 16)/" \
#       deploy/k8s/secret.example.yaml | kubectl --context blacksmith apply -f -
#
# GATEKEEPER_SERVICES must list every service on the plane as name=key. A service
# missing from it cannot authenticate, and the symptom is not a clean rejection:
# it serves normally and fails its permission checks. Both entries use the same
# key here because one operator holds the whole plane; split them if that changes.
apiVersion: v1
kind: Secret
metadata:
  name: forge-local
  namespace: blacksmith
stringData:
  # Shared between the local gatekeeper, the local forge and the local ticket
  # store. Generate with `openssl rand -hex 32`; it never leaves this cluster.
  GATEKEEPER_SERVICE_KEY: "REPLACE_SERVICE_KEY"
  GATEKEEPER_SERVICES: "forge=REPLACE_SERVICE_KEY,tickets=REPLACE_SERVICE_KEY"
  # The local gatekeeper's admin bootstrap. Both names matter: gatekeeper reads
  # GATEKEEPER_ADMIN_EMAIL/PASSWORD, and it seeds no admin at all if they are
  # absent — leaving a gatekeeper nobody can log into. This password is what
  # blacksmith sends as AGENTS_FORGE_PASSWORD, so the two must agree.
  GATEKEEPER_ADMIN_EMAIL: "admin@blacksmith.invalid"
  GATEKEEPER_ADMIN_PASSWORD: "REPLACE_ADMIN_PASSWORD"
  # Matches the DATABASE_URLs in forge-local.yaml, which embed it in plain text;
  # change it in both places or neither.
  POSTGRES_PASSWORD: "forge-local"
