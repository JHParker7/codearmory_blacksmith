[pytest]
# ONLY tests/integration. The files directly under tests/ are the baseline copied
# from the Python prototype (see `chore: baseline copied from blacksmith`); they
# import a `blacksmith` Python package this rebuild does not have, so collecting
# them yields import errors rather than results. Named here rather than left to
# discovery so the exclusion is a decision on the record instead of a surprise.
testpaths = tests/integration

# The department is terminated while a poll is in flight, so a fake server can
# see the client go away mid-reply. Promoting that to a test failure turned every
# passing test into a failure about a closed socket; the handler itself treats
# the two connection errors as the expected end of a test.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
